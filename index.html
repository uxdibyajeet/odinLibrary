<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="banner">
      <h1 class="hero">Welcome to Odin Library!</h1>
      <p class="subtitle">Organize your books and track what you've read</p>
    </div>
    <div class="container">
      <div class="title">
        <h2 class="headingOne">Your Books</h2>
        <button class="primaryBtn btn" id="addNew">Add New Book</button>
      </div>
      <table>
        <thead id="header">
          <tr>
            <th>Status</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="modal hidden">
      <div class="modal-header">
        <p class="modal-headline">Add New Book</p>
      </div>
      <form>
        <label for="bookName">Book Name</label>
        <input
          type="text"
          id="bookName"
          name="bookName"
          placeholder="Harry Potter"
        />
        <label for="authorName">Author Name</label>
        <input
          type="text"
          id="authorName"
          name="authorName"
          placeholder="J.K. Rowling"
        />
        <label for="pages">Number of Page</label>
        <input type="number" id="pages" name="pages" placeholder="270" />
        <label for="status">Status</label>
        <div class="wrapper">
          <input type="checkbox" id="status" class="checkBox" name="status" />
          <p class="helper"></p>
        </div>
      </form>
      <div class="modal-footer">
        <button class="secondaryBtn btn" id="closeModal">Cancel</button>
        <button class="primaryBtn btn">Add</button>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
